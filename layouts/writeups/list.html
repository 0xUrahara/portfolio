{{ define "main" }}
<div class="container">
  <section class="content-card">
    <h1 class="card-title">> {{ .Title }}</h1>
    
    {{ range .Pages }}
      {{ if not .Draft }}
      <div class="content-card" style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
        <h2><a href="{{ .Permalink }}" style="color: var(--accent);">{{ .Title }}</a></h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem;">
          📅 {{ .Date.Format "2006-01-02" }}
          {{ if .Params.tags }} | Tags: {{ range .Params.tags }}<span style="color: var(--accent);">#{{ . }}</span> {{ end }}{{ end }}
        </p>
        
        <!-- Force short summary: 30 words max -->
        <p style="margin: 1rem 0; line-height: 1.6;">
          {{ .Summary | truncate 30 "..." }}
        </p>
        
        <a href="{{ .Permalink }}" class="btn">Read Full Details &rarr;</a>
      </div>
      {{ end }}
    {{ end }}
  </section>
</div>
{{ end }}
